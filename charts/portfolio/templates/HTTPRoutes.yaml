apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-www-luisito-dev
spec:
  parentRefs:
  - name: gateway
    sectionName: https-www-luisito-dev
    namespace: operations
  hostnames:
  - www.luisito.dev
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: portfolio
      port: 80
    # AI endpoints (chat, generate-cv) can legitimately take >60s (LLM call).
    # Raise gateway timeout above the sidecar (150s) and gunicorn (120s).
    timeouts:
      backendRequest: 180s
---
